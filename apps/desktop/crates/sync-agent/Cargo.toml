[package]
name = "sync-agent"
edition.workspace = true
version.workspace = true
description = "MaxCloud desktop sync engine: scans the sync folder, talks to the API, executes sync-core plans"

[lib]
path = "src/lib.rs"

[[bin]]
name = "maxcloud-sync"
path = "src/main.rs"

[dependencies]
sync-core = { path = "../sync-core" }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
