[package]
name = "maxcloud-desktop"
version = "0.1.0"
edition = "2021"
description = "MaxCloud desktop app: tray icon + settings window around sync-agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync-agent = { path = "../crates/sync-agent" }
sync-core = { path = "../crates/sync-core" }
