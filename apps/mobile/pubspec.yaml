name: maxcloud
description: MaxCloud — cloud storage with photo auto-backup.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  photo_manager: ^3.5.0
  workmanager: ^0.5.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
