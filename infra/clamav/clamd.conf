# clamd tuned for scanning user uploads over INSTREAM (apps/api/src/jobs/clamav.ts)
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
# Scan files up to 4 GB; larger files are marked SKIPPED by the worker's size guard.
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
MaxThreads 4
ReadTimeout 600
CommandReadTimeout 30
LogTime yes
