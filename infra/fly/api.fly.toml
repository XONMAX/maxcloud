# fly deploy -c infra/fly/api.fly.toml --dockerfile apps/api/Dockerfile
# Region: Frankfurt is the lowest-latency Fly region from Tashkent (~85 ms). See ARCHITECTURE.md "Data residency".
app = "maxcloud-api"
primary_region = "fra"

[build]
  dockerfile = "../../apps/api/Dockerfile"

[deploy]
  release_command = "./node_modules/.bin/prisma migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  WEB_ORIGIN = "https://maxcloud.uz"
  STORAGE_PROVIDER = "b2"
  S3_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
  S3_REGION = "eu-central-003"
  S3_BUCKET = "maxcloud-prod"
  S3_SSE = "AES256"
  DOWNLOAD_MODE = "worker"
  DOWNLOAD_BASE_URL = "https://dl.maxcloud.uz"
  COOKIE_SECURE = "true"
  PAYME_CHECKOUT_URL = "https://checkout.paycom.uz"
  # Secrets: fly secrets set DATABASE_URL REDIS_URL JWT_SECRET APP_ENCRYPTION_KEY S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
  #          DOWNLOAD_SIGNING_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PAYME_MERCHANT_ID PAYME_KEY SMTP_URL SENTRY_DSN
  #          GOOGLE_CLIENT_ID APPLE_CLIENT_ID STRIPE_PRICE_S50_MONTH ... (from scripts/stripe-setup.ts)

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 2
  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 600
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[metrics]
  port = 4000
  path = "/metrics"
