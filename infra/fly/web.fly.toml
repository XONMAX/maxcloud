app = "maxcloud-web"
primary_region = "fra"

[build]
  dockerfile = "../../apps/web/Dockerfile"
  [build.args]
    NEXT_PUBLIC_GOOGLE_CLIENT_ID = ""
    NEXT_PUBLIC_APPLE_CLIENT_ID = ""

[env]
  API_INTERNAL_URL = "http://maxcloud-api.internal:4000"

[http_service]
  internal_port = 3000
  force_https = true
  min_machines_running = 2
  auto_stop_machines = "off"
  [[http_service.checks]]
    interval = "15s"
    method = "GET"
    path = "/login"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
